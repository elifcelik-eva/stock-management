services:
  config-server:
    build:
      context: ../config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - stock-management-network-backend
    restart: on-failure
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - "SPRING_PROFILES_ACTIVE=stage"
      - "GITHUB_USERNAME=${GITHUB_USERNAME}"
      - "GITHUB_TOKEN=${GITHUB_TOKEN}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16
    container_name: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - stock-management-network-backend
    ports:
      - "5433:5432"
    restart: on-failure
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - stock-management-network-backend
    restart: on-failure
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  product-service:
    build:
      context: ../product-service
      dockerfile: Dockerfile
    container_name: product-service
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "9788:9788"
    networks:
      - stock-management-network-backend
    restart: on-failure
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9788/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - "SPRING_PROFILES_ACTIVE=stage"
      - "DB_USERNAME=${DB_USERNAME}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "CONFIG_SERVER_URL=${CONFIG_SERVER_URL}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  product-cache-service:
    build:
      context: ../product-cache-service
      dockerfile: Dockerfile
    container_name: product-cache-service
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "9791:9791"
    networks:
      - stock-management-network-backend
    restart: on-failure
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9791/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - "SPRING_PROFILES_ACTIVE=stage"
      - "REDIS_PASSWORD=${REDIS_PASSWORD}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  spring-cloud-gateway:
    build:
      context: ../spring-cloud-gateway
      dockerfile: Dockerfile
    container_name: spring-cloud-gateway
    depends_on:
      product-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - stock-management-network-backend
    ports:
      - "8762:8762"
    restart: on-failure
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8762/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - "SPRING_PROFILES_ACTIVE=stage"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:

networks:
  stock-management-network-backend:
    driver: bridge
