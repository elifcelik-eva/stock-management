spring:
  application:
    name: spring-cloud-gateway
  profiles:
    active: localhost
info:
  component: Spring Cloud Gateway
---
spring:
  config:
    activate:
      on-profile: localhost
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/1.0/product/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true

server:
  port: 8762